# Publish the images, from a vX.Y.Z tag of this repository.
#
# Every image is built for amd64 and arm64 on native runners, and every step is
# run on each before anything is pushed. Then one manifest list per language
# joins the two, tagged <library version>, <library version>-t<X.Y.Z> and
# latest. Nothing is published to any library feed.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./etc/check-pins.sh
      - name: The tag has a CHANGELOG entry
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::no CHANGELOG entry for ${GITHUB_REF_NAME#v}"; exit 1; }

  build:
    needs: preflight
    name: ${{ matrix.lang }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lang: [java, python, ruby, dotnet, go]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: ./etc/build-image.sh ${{ matrix.lang }} --load --cache-from type=gha,scope=${{ matrix.lang }}-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=${{ matrix.lang }}-${{ matrix.arch }}
      - name: Run every step against the broker inside it
        run: |
          . ./pins.env
          v="$(echo ${{ matrix.lang }} | tr a-z A-Z)_VERSION"
          docker run --rm "ghcr.io/acemq-company/acemq-tutorials-${{ matrix.lang }}:${!v}" all
      - name: Push by digest
        # The same build again, from the cache, pushed untagged: the tags go on
        # the manifest list, once both architectures have passed.
        run: |
          TAG= ./etc/build-image.sh ${{ matrix.lang }} \
            --cache-from type=gha,scope=${{ matrix.lang }}-${{ matrix.arch }} \
            --provenance=false \
            --output type=image,name=ghcr.io/acemq-company/acemq-tutorials-${{ matrix.lang }},push-by-digest=true,name-canonical=true,push=true \
            --metadata-file meta.json
          mkdir -p digests
          python3 -c 'import json; print(json.load(open("meta.json"))["containerimage.digest"])' > digests/${{ matrix.arch }}
          cat digests/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.lang }}-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}

  publish:
    needs: build
    name: publish ${{ matrix.lang }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        lang: [java, python, ruby, dotnet, go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.lang }}-*
          merge-multiple: true
          path: digests
      - name: Tag the manifest list
        run: |
          . ./pins.env
          v="$(echo ${{ matrix.lang }} | tr a-z A-Z)_VERSION"
          image="ghcr.io/acemq-company/acemq-tutorials-${{ matrix.lang }}"
          docker buildx imagetools create \
            -t "$image:${!v}" -t "$image:${!v}-t${GITHUB_REF_NAME#v}" -t "$image:latest" \
            "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
          docker buildx imagetools inspect "$image:${!v}"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
