name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Monday morning: a library release moves underneath this repository without
  # a commit landing here, and only something on a timer will notice.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: the pins are the newest releases
    # A job of its own: a stale pin and a broken step are different findings,
    # and the images below still build and run whatever this concludes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./etc/check-pins.sh

  steps:
    name: every step, ${{ matrix.lang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [java, python, ruby, dotnet, go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        run: ./etc/build-image.sh ${{ matrix.lang }} --load --cache-from type=gha,scope=${{ matrix.lang }}-amd64 --cache-to type=gha,mode=max,scope=${{ matrix.lang }}-amd64
      - name: Run every step against the broker inside it
        run: |
          . ./pins.env
          v="$(echo ${{ matrix.lang }} | tr a-z A-Z)_VERSION"
          docker run --rm "ghcr.io/acemq-company/acemq-tutorials-${{ matrix.lang }}:${!v}" all
      - name: The commands a reader is told about
        run: |
          . ./pins.env
          v="$(echo ${{ matrix.lang }} | tr a-z A-Z)_VERSION"
          image="ghcr.io/acemq-company/acemq-tutorials-${{ matrix.lang }}:${!v}"
          docker run --rm "$image" | grep -q 'Your first message'
          docker run --rm "$image" version | grep -q "library *${!v}"
          if docker run --rm "$image" step 99; then echo "::error::step 99 should fail"; exit 1; fi

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: ./etc/build-site.sh
