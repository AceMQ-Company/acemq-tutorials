name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Monday morning: a library release moves underneath this repository without
  # a commit landing here, and only something on a timer will notice.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: the pins are the newest releases
    # A job of its own: a stale pin and a broken step are different findings,
    # and the images below still build and run whatever this concludes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./etc/check-pins.sh

  steps:
    uses: ./.github/workflows/steps.yml

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: ./etc/build-site.sh
